name: Generate Signing Keystore (run once)

# Run this manually ONCE (Actions tab → this workflow → "Run workflow"),
# entering a password of your choosing at the prompt that appears — the
# password never gets written into the repo this way.
#
# Google Play ties an app's identity to whichever key first signs it —
# every future update must be signed with this SAME key, or Play will
# reject the update as "not matching" the original app. So this key must
# never be regenerated once the app has a real Play Console listing;
# back up the base64 value this prints somewhere outside GitHub too
# (e.g. a password manager), not only as a GitHub secret — if the secret
# is ever lost with no other copy, the app can never be updated again
# under the same listing.
#
# After running: copy the base64 block printed in the job log's
# "Print keystore as base64" step, then in GitHub → repo Settings →
# Secrets and variables → Actions → New repository secret, create:
#   KEYSTORE_BASE64      = the printed base64 block
#   KEYSTORE_PASSWORD    = the same password you typed in the prompt below
#   KEY_ALIAS            = luna_chess_upload
#   KEY_PASSWORD         = the same password you typed in the prompt below
# The build_apk.yml workflow reads these four secrets on every run.

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Password for the new keystore (write this down — you will need it again for the KEYSTORE_PASSWORD and KEY_PASSWORD secrets)'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-22.04
    steps:
      - name: Generate keystore
        env:
          KS_PASSWORD: ${{ inputs.keystore_password }}
        run: |
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore upload-keystore.jks \
            -alias luna_chess_upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KS_PASSWORD" \
            -keypass "$KS_PASSWORD" \
            -dname "CN=Bobur, OU=Luna Chess, O=Bobur, L=Unknown, ST=Unknown, C=UZ"

      - name: Print keystore as base64
        run: |
          echo "==================================================================="
          echo "COPY EVERYTHING BETWEEN THE LINES BELOW INTO THE KEYSTORE_BASE64 SECRET"
          echo "==================================================================="
          base64 -w 0 upload-keystore.jks
          echo ""
          echo "==================================================================="
          echo "Now go to repo Settings -> Secrets and variables -> Actions and add:"
          echo "  KEYSTORE_BASE64   = the base64 block printed above"
          echo "  KEYSTORE_PASSWORD = the password you entered when running this workflow"
          echo "  KEY_ALIAS         = luna_chess_upload"
          echo "  KEY_PASSWORD      = the password you entered when running this workflow"
          echo "==================================================================="
